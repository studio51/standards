# Studio51 · rails
# Omakase Ruby styling + Performance cops, the only accepted RuboCop config
# across Studio51 Ruby repos. Add `rubocop-rails-omakase` and `rubocop-performance`
# to the Gemfile's :development group.
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

require:
  - rubocop-performance

# House overrides go below; keep them minimal.

# Studio51 comment style puts a blank line after a namespace module / `class << self`
# opening (breathing room before the first documented member). Allow it.
Layout/EmptyLinesAroundModuleBody:
  Enabled: false
Layout/EmptyLinesAroundClassBody:
  Enabled: false
