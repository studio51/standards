name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      # SwiftLint ships preinstalled on GitHub macOS runners.
      - run: swiftlint --strict

  build-test:
    name: Build & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      # Always the latest stable Xcode (runtime currency policy), never a version number.
      - name: Select the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Resolve scheme and container
        id: xc
        run: |
          if ls *.xcworkspace >/dev/null 2>&1; then
            flag="-workspace $(ls -d *.xcworkspace | head -1)"
          elif ls *.xcodeproj >/dev/null 2>&1; then
            flag="-project $(ls -d *.xcodeproj | head -1)"
          else
            flag=""   # Swift Package: xcodebuild infers it
          fi
          scheme=$(xcodebuild $flag -list -json | python3 -c "import sys, json; d = json.load(sys.stdin); print((d.get('project') or d.get('workspace') or {}).get('schemes', [''])[0])")
          echo "flag=$flag" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
      # The first iPhone on the newest iOS runtime the runner has, rather than a named model
      # that ages out of the runner images.
      - name: Pick the newest iPhone simulator
        id: sim
        run: |
          udid=$(python3 - <<'PY'
          import json, subprocess
          devices = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          def version(runtime):
              return [int(part) for part in runtime.split(".iOS-")[1].split("-")]
          runtimes = sorted((r for r in devices if ".iOS-" in r
                             and any(d["name"].startswith("iPhone") for d in devices[r])), key=version)
          print(next(d["udid"] for d in devices[runtimes[-1]] if d["name"].startswith("iPhone")))
          PY
          )
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            ${{ steps.xc.outputs.flag }} \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO | (xcbeautify 2>/dev/null || cat)
